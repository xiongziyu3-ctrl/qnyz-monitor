# GitHub Actions 监控组 B：入住 9/7 → 离店 9/12，仅个人，全区
# 不含密钥；Bark key 由 Actions Secret（BARK_URL）注入。

base_url: "https://qnyz.shyouth.net/qnyzApi"
verify_ssl: false
check_availability: true
concurrency: 10

filters:
  name: ""
  user_type: 2
  apply_scope: "personal"
  districts:
  - "黄浦区"
  - "静安区"
  - "徐汇区"
  - "长宁区"
  date_from: "2026-12-01"
  date_to: ""
  min_house_count: 0
  min_apply_number: 1

notify:
  type: "bark"
  url: ""          # 由环境变量 QNYZ_NOTIFY_URL 注入

log_file: ""
